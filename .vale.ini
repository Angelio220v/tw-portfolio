# Vale configuration: https://vale.sh/docs/topics/config
# Where style packages and project vocabulary live.
StylesPath = .vale/styles

# Report suggestions, warnings and errors.
MinAlertLevel = suggestion

# Project vocabulary: .vale/styles/config/vocabularies/Portfolio/accept.txt
Vocab = Portfolio

# Downloaded style packages, pinned to a release so that every machine and
# CI use the same rules. To update, change the version and run `vale sync`.
# Releases: https://github.com/vale-cli/Microsoft/releases
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.2/Microsoft.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, ServeFlow
# Style guide: punctuation goes outside quotation marks
Microsoft.Quotes = NO

# Private Russian-language notes: do not lint.
[**/notes/**.md]
BasedOnStyles =
